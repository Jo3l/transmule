name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    # Also rebuild when version tags are pushed (v1.4 or v1.4.0)
    tags: ["v*.*", "v*.*.*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jo3l/transmule

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `type=semver` exige X.Y.Z y este repo etiqueta como vX.Y, así que
          # nunca generaba tag de versión: solo latest y sha-*. `match` toma el
          # nombre del tag tal cual (v1.185 -> 1.185) y sigue sirviendo si algún
          # día se pasa a vX.Y.Z.
          tags: |
            type=raw,value=latest
            type=match,pattern=v(.*),group=1
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
